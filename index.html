    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Friend Chat" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

  <body>
    <div id="root">
      <div id="friend-boot" role="status" style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:#0f3d26">
        <div class="friend-boot-spin" style="width:34px;height:34px;border-radius:50%;border:3px solid rgba(15,61,38,.2);border-top-color:#0f3d26"></div>
        <p style="margin:0;font-size:15px;opacity:.85">Loading Friend Chat…</p>
      </div>
    </div>
    <noscript>Friend Chat needs JavaScript turned on.</noscript>
    <style>
      @keyframes friend-boot-spin { to { transform: rotate(360deg); } }
      .friend-boot-spin { animation: friend-boot-spin 0.9s linear infinite; }
      @media (prefers-reduced-motion: reduce) { .friend-boot-spin { animation: none; } }
      @media (prefers-color-scheme: dark) { #friend-boot, #friend-stuck { color: #e8f5ee !important; } #friend-stuck .card { background: #14261c !important; border-color: #2c4a39 !important; } }
    </style>
    <script>
      // Shown only if the app itself can't start (very old browser, blocked script, start-up crash).
      (function () {
        var problems = [];
        function note(message) {
          if (message && problems.length < 4) problems.push(String(message).slice(0, 240));
        }
        window.addEventListener("error", function (event) {
          note(event && (event.message || (event.error && event.error.message)));
        });
        window.addEventListener("unhandledrejection", function (event) {
          var reason = event && event.reason;
          note(reason && (reason.message || reason));
        });
        function startFresh() {
          try {
            var doomed = [];
            for (var i = 0; i < localStorage.length; i++) {
              var key = localStorage.key(i);
              if (key && key.indexOf("friend-chat") === 0 && key !== "friend-chat:v2:invite" && key !== "friend-chat:v2:keys") doomed.push(key);
            }
            for (var j = 0; j < doomed.length; j++) localStorage.removeItem(doomed[j]);
          } catch (e) {}
          location.reload();
        }
        function show(detail) {
          if (window.__friendStarted) return;
          note(detail);
          var root = document.getElementById("root");
          if (!root) return;
          var button = "border-radius:999px;padding:10px 18px;font:inherit;font-size:15px;cursor:pointer;";
          root.innerHTML =
            '<div id="friend-stuck" role="alert" style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box;font-family:system-ui,-apple-system,\'Segoe UI\',Roboto,sans-serif;color:#10231a">' +
            '<div class="card" style="max-width:440px;background:#fff;border:1px solid #d7e3dc;border-radius:24px;padding:24px;display:flex;flex-direction:column;gap:14px">' +
            '<h1 style="margin:0;font-size:21px;font-weight:600">Friend Chat didn\'t start</h1>' +
            '<p style="margin:0;font-size:15px;line-height:1.5">Reload the page first. If it keeps happening, update your browser (on iPhone: Settings, General, Software Update) or try another browser or network. Start fresh resets the app on this device; your invite code stays.</p>' +
            '<div style="display:flex;gap:10px;flex-wrap:wrap">' +
            '<button id="friend-reload" type="button" style="' + button + 'background:#0f3d26;color:#fff;border:0">Reload</button>' +
            '<button id="friend-fresh" type="button" style="' + button + 'background:transparent;color:inherit;border:1px solid currentColor">Start fresh</button>' +
            "</div>" +
            '<p id="friend-detail" style="margin:0;font-size:12px;opacity:.75;word-break:break-word"></p>' +
            "</div></div>";
          document.getElementById("friend-reload").onclick = function () {
            location.reload();
          };
          document.getElementById("friend-fresh").onclick = startFresh;
          document.getElementById("friend-detail").textContent = "Details: " + (problems.join(" | ") || "the app didn't start in time");
        }
        window.__friendBootFail = show;
        function watch(round) {
          setTimeout(function () {
            if (window.__friendStarted) return;
            // The app is running and still connecting: give it a little longer.
            if (window.__friendModuleRan && round < 2) return watch(round + 1);
            show();
          }, round === 0 ? 20000 : 15000);
        }
        watch(0);
      })();
    </script>
