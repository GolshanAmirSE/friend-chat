  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Talk with a friend by text, voice call or video call in 23 languages, including Persian and Kurdish (Sorani)." />
    <meta name="author" content="Amir Golshan" />
    <meta name="theme-color" content="#f6f6f6" />
    <script>
      // Dress the page in this device's look before anything is drawn, so the classic green never flashes by
      // while the app starts. Mirrors deviceOS() and resolveLook() in the app (src/lib/platform.ts).
      (function () {
        try {
          var nav = navigator;
          var ua = nav.userAgent || "";
          var platform = String((nav.userAgentData && nav.userAgentData.platform) || nav.platform || "").toLowerCase();
          var os = "other";
          if (/iPad|iPhone|iPod/.test(ua) || (platform === "macintel" && nav.maxTouchPoints > 1)) os = "ios";
          else if (/Android/i.test(ua) || platform === "android") os = "android";
          else if (/Mac OS X|Macintosh/.test(ua) || platform.indexOf("mac") === 0) os = "mac";
          else if (/Windows/.test(ua) || platform.indexOf("win") === 0) os = "windows";
          else if (/Linux|X11|CrOS/.test(ua) || platform.indexOf("linux") === 0 || platform === "chrome os") os = "linux";
          var look = os === "ios" || os === "mac" ? "ios" : os === "android" ? "android" : "classic";
          try {
            var saved = JSON.parse(localStorage.getItem("friend-chat:v2:settings") || "null");
            if (saved && (saved.look === "ios" || saved.look === "android" || saved.look === "classic")) look = saved.look;
          } catch (e) {}
          var root = document.documentElement;
          root.setAttribute("data-look", look);
          root.setAttribute("data-os", os);
          var dark = !!(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
          var bars = { ios: ["#f6f6f6", "#1c1c1e"], android: ["#f8fafd", "#1e1f20"], classic: ["#0f3d26", "#0f3d26"] };
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", bars[look][dark ? 1 : 0]);
        } catch (e) {}
      })();
    </script>

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Friend Chat" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  </head>
  <body>
    <div id="root">
      <div id="friend-boot" role="status" style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--look-chat,transparent);color:var(--muted-foreground,#6b7280)">
        <div class="friend-boot-spin" style="width:30px;height:30px;border-radius:50%;border:3px solid rgba(128,128,128,.22);border-top-color:currentColor"></div>
        <p style="margin:0;font-size:15px">Loading Friend Chat…</p>
      </div>
    </div>
    <noscript>Friend Chat needs JavaScript turned on.</noscript>
    <style>
      @keyframes friend-boot-spin { to { transform: rotate(360deg); } }
      .friend-boot-spin { animation: friend-boot-spin 0.9s linear infinite; }
      @media (prefers-reduced-motion: reduce) { .friend-boot-spin { animation: none; } }
    </style>
    <script>
      // Shown only if the app itself can't start (very old browser, blocked script, start-up crash).
      (function () {
        var problems = [];
        function note(message) {
          if (message && problems.length < 4) problems.push(String(message).slice(0, 240));
        }
        window.addEventListener("error", function (event) {
          note(event && (event.message || (event.error && event.error.message)));
        });
        window.addEventListener("unhandledrejection", function (event) {
          var reason = event && event.reason;
          note(reason && (reason.message || reason));
        });
        function startFresh() {
          try {
            var doomed = [];
            for (var i = 0; i < localStorage.length; i++) {
              var key = localStorage.key(i);
              if (key && key.indexOf("friend-chat") === 0 && key !== "friend-chat:v2:invite" && key !== "friend-chat:v2:keys") doomed.push(key);
            }
            for (var j = 0; j < doomed.length; j++) localStorage.removeItem(doomed[j]);
          } catch (e) {}
          location.reload();
        }
        function show(detail) {
          if (window.__friendStarted) return;
          note(detail);
          var root = document.getElementById("root");
          if (!root) return;
          var button = "border-radius:999px;padding:10px 18px;font:inherit;font-size:15px;cursor:pointer;";
          root.innerHTML =
            '<div id="friend-stuck" role="alert" style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box;font-family:system-ui,-apple-system,\'Segoe UI\',Roboto,sans-serif;background:var(--look-chat,transparent);color:var(--foreground,#10231a)">' +
            '<div class="card" style="max-width:440px;background:var(--card,#fff);border:1px solid var(--border,#d7e3dc);border-radius:24px;padding:24px;display:flex;flex-direction:column;gap:14px">' +
            '<h1 style="margin:0;font-size:21px;font-weight:600">Friend Chat didn\'t start</h1>' +
            '<p style="margin:0;font-size:15px;line-height:1.5">Reload the page first. If it keeps happening, update your browser (on iPhone: Settings, General, Software Update) or try another browser or network. Start fresh resets the settings on this device; your invite code and conversations stay.</p>' +
            '<div style="display:flex;gap:10px;flex-wrap:wrap">' +
            '<button id="friend-reload" type="button" style="' + button + 'background:var(--primary,#0f3d26);color:var(--primary-foreground,#fff);border:0">Reload</button>' +
            '<button id="friend-fresh" type="button" style="' + button + 'background:transparent;color:inherit;border:1px solid currentColor">Start fresh</button>' +
            "</div>" +
            '<p id="friend-detail" style="margin:0;font-size:12px;opacity:.75;word-break:break-word"></p>' +
            "</div></div>";
          document.getElementById("friend-reload").onclick = function () {
            location.reload();
          };
          document.getElementById("friend-fresh").onclick = startFresh;
          document.getElementById("friend-detail").textContent = "Details: " + (problems.join(" | ") || "the app didn't start in time");
        }
        window.__friendBootFail = show;
        function watch(round) {
          setTimeout(function () {
            if (window.__friendStarted) return;
            // The app is running and still connecting: give it a little longer.
            if (window.__friendModuleRan && round < 2) return watch(round + 1);
            show();
          }, round === 0 ? 20000 : 15000);
        }
        watch(0);
