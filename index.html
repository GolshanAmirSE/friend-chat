    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Talk with a friend by text, voice call or video call in 23 languages, including Persian and Kurdish (Sorani)." />
    <meta name="author" content="Amir Golshan" />
    <meta name="theme-color" content="#f6f6f6" />
    <script>
      // Dress the page in this device's look before anything is drawn, so the classic green never flashes by
      // while the app starts. Mirrors deviceOS() and resolveLook() in the app (src/lib/platform.ts).
      (function () {
        try {
          var nav = navigator;
          var ua = nav.userAgent || "";
          var platform = String((nav.userAgentData && nav.userAgentData.platform) || nav.platform || "").toLowerCase();
          var os = "other";
          if (/iPad|iPhone|iPod/.test(ua) || (platform === "macintel" && nav.maxTouchPoints > 1)) os = "ios";
          else if (/Android/i.test(ua) || platform === "android") os = "android";
          else if (/Mac OS X|Macintosh/.test(ua) || platform.indexOf("mac") === 0) os = "mac";
          else if (/Windows/.test(ua) || platform.indexOf("win") === 0) os = "windows";
          else if (/Linux|X11|CrOS/.test(ua) || platform.indexOf("linux") === 0 || platform === "chrome os") os = "linux";
          var look = os === "ios" || os === "mac" ? "ios" : os === "android" ? "android" : "modern";
          try {
            var saved = JSON.parse(localStorage.getItem("friend-chat:v2:settings") || "null");
            if (saved && (saved.look === "ios" || saved.look === "android" || saved.look === "modern")) look = saved.look;
            if (saved && saved.look === "classic") look = "modern";
          } catch (e) {}
          var root = document.documentElement;
          root.setAttribute("data-look", look);
          root.setAttribute("data-os", os);
          var dark = !!(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
          var bars = { ios: ["#f6f6f6", "#1c1c1e"], android: ["#f8fafd", "#1e1f20"], modern: ["#ffffff", "#212121"] };
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", bars[look][dark ? 1 : 0]);
        } catch (e) {}
      })();
    </script>

            '<div class="card" style="max-width:440px;background:var(--card,#fff);border:1px solid var(--border,#d7e3dc);border-radius:24px;padding:24px;display:flex;flex-direction:column;gap:14px">' +

            '<button id="friend-reload" type="button" style="' + button + 'background:var(--primary,#0f3d26);color:var(--primary-foreground,#fff);border:0">Reload</button>' +

            '<p id="friend-detail" style="margin:0;font-size:12px;opacity:.75;word-break:break-word"></p>' +
            "</div></div>";
          document.getElementById("friend-reload").onclick = function () {
            location.reload();
          };
          document.getElementById("friend-fresh").onclick = startFresh;

        }

          setTimeout(function () {
            if (window.__friendStarted) return;
            // The app is running and still connecting: give it a little longer.
            if (window.__friendModuleRan && round < 2) return watch(round + 1);

        }
